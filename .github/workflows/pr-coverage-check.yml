name: PR Test Coverage Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["**/*.cs", "**/*.csproj"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run xUnit tests with coverage
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Build coverage summary
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;JsonSummary"

      - name: Build PR comment
        run: |
          line=$(jq -r '.summary.linecoverage // 0' coverage/Summary.json)
          branch=$(jq -r '.summary.branchcoverage // 0' coverage/Summary.json)
          rating=$(awk -v l="$line" 'BEGIN{ if (l>=80) print "🟢 Good"; else if (l>=60) print "🟡 Fair"; else print "🔴 Needs work" }')

          # Changed production .cs files (skip tests, generated, migrations, bin/obj)
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.cs' \
            | grep -viE '(\.Tests?/|Tests?/|/obj/|/bin/|Migrations/|\.g\.cs$|\.Designer\.cs$)' > changed.txt || true

          {
            echo "## 🧪 Test Coverage Check"
            echo ""
            echo "@${{ github.event.pull_request.user.login }}: **Overall:** $rating (Line ${line}% / Branch ${branch}%)"
            echo ""
            if [ -s changed.txt ]; then
              echo "| Changed file | xUnit test found? |"
              echo "|---|---|"
              missing=0
              while read -r f; do
                base=$(basename "$f" .cs)
                if git ls-files | grep -qiE "/${base}Tests?\.cs$"; then
                  echo "| \`$f\` | ✅ \`${base}Tests.cs\` |"
                else
                  echo "| \`$f\` | ❌ No \`${base}Tests.cs\` found |"
                  missing=$((missing+1))
                fi
              done < changed.txt
              echo ""
              if [ "$missing" -gt 0 ]; then
                echo "**Suggestion:** add a \`<ClassName>Tests\` class for each ❌ file. Open the **testsAgent** custom agent in VS Code Copilot Chat and ask it to generate xUnit tests for those classes."
              fi
            else
              echo "_No production .cs files changed._"
            fi
            echo ""
            echo "<details><summary>Full coverage summary</summary>"
            echo ""
            cat coverage/SummaryGithub.md
            echo "</details>"
          } > comment.md

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file comment.md \
          || gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md